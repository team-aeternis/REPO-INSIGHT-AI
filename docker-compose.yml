services:
  mongodb:
    image: mongo:7
    container_name: repo-intel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: repo-intel-server
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URL: mongodb://mongodb:27017/repo_intelligence
      MONGO_DB_NAME: repo_intelligence
      FRONTEND_URL: http://localhost:5173
      LLM_API_KEY: ${LLM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}

volumes:
  mongo_data:
